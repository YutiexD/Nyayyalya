<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nyayyalya — Digital evidence register</title>
    <meta
      name="description"
      content="Nyayyalya — an evidence register for the Indian criminal justice chain. Hashed and signed in the browser, append-only ledger, Merkle-anchored."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme BEFORE first paint. Without this the page renders light
      // and then flips, which on a projector reads as a glitch.
      (function () {
        try {
          var t = localStorage.getItem('lexx.theme') || 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          /* private mode: default light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
